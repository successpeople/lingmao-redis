# Render Blueprint (optional): New → Blueprint → paste repo URL & use this file
# Set REDIS_* and optional API_KEY in dashboard if not using synced secrets.

services:
  - type: web
    name: lingmao-redis-api
    runtime: node
    # 必须写 free：Blueprint 不写 plan 时可能默认 starter，会强制绑卡验证
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
